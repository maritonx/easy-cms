# Local OpenTelemetry for Easy CMS: the app sends OTLP to the collector, which sends traces to
# Jaeger (http://localhost:16686) and serves metrics to Prometheus (http://localhost:9090).
#   docker compose up -d
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4318:4318' # OTLP over HTTP, where the app sends
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - '16686:16686' # the Jaeger UI
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

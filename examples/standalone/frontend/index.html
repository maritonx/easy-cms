<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Easy CMS standalone: frontend</title>
  </head>
  <body>
    <!--
      Any frontend can read the CMS over REST from the browser. Serve this page from an origin
      listed in `cors` (default http://localhost:5173), e.g. `npx serve -l 5173 frontend`.
      `?api=` points it at another CMS (default http://localhost:4000/api/cms).
      `?post=<id>` shows one post: the admin's live preview opens it with a preview token.
      `?contact` shows the "contact" form from the CMS.
      `?page=/about/team` shows a page by its full path (the nested docs plugin).
    -->
    <main id="app"></main>
    <script type="module">
      const params = new URLSearchParams(location.search)
      const api = params.get('api') ?? 'http://localhost:4000/api/cms'
      const origin = new URL(api).origin
      const app = document.querySelector('#app')
      const get = async (path) => {
        const response = await fetch(`${api}${path}`)
        if (!response.ok) throw new Error(`${path}: ${response.status}`)
        return response.json()
      }
      const el = (tag, props = {}, ...children) => {
        const node = Object.assign(document.createElement(tag), props)
        node.append(...children)
        return node
      }
      const coverOf = (post) =>
        post.cover?.url
          ? el('img', { src: new URL(post.cover.url, origin).href, alt: post.cover.alt ?? '', width: 120 })
          : ''

      // A form built in the admin under Forms: the CMS serves the <easy-form> element too.
      async function contact() {
        await import(`${api}/form/element.js`)
        const form = el('easy-form')
        form.setAttribute('form', 'contact')
        form.setAttribute('api', api)
        app.replaceChildren(el('h1', { textContent: 'Contact' }), form)
      }

      const pageLink = (path) =>
        el('a', { href: `?page=${encodeURIComponent(path ?? '/')}&api=${encodeURIComponent(api)}` })

      // The menu: published pages and the pages under them (nested docs plugin: GET /tree/:collection).
      const menuOf = (nodes) =>
        el('ul', { className: 'menu' }, ...nodes.map((node) => {
          const link = Object.assign(pageLink(node.path), { textContent: node.title })
          return el('li', {}, link, node.children.length ? menuOf(node.children) : '')
        }))

      // A page by its full path, with its breadcrumbs.
      async function page(path) {
        const { docs } = await get(`/pages?where[path][equals]=${encodeURIComponent(path)}&limit=1`)
        const found = docs[0]
        if (!found) return app.replaceChildren(el('p', { textContent: 'Page not found.' }))
        const trail = found.breadcrumbs ?? []
        app.replaceChildren(
          el('nav', { ariaLabel: 'Breadcrumb' }, el('ol', {}, ...trail.map((crumb, i) =>
            el('li', {}, i < trail.length - 1
              ? Object.assign(pageLink(crumb.url), { textContent: crumb.label })
              : el('span', { textContent: crumb.label })),
          ))),
          el('h1', { textContent: found.title }),
        )
      }

      async function list() {
        const site = await get('/globals/site')
        // Anonymous requests only see published posts (the collection's read access).
        const { docs } = await get('/posts?sort=-createdAt&depth=1&limit=20')
        const menu = await get('/tree/pages?depth=2')
        app.replaceChildren(
          el('h1', { textContent: site.siteName }),
          el('p', { textContent: site.tagline ?? '' }),
          menu.length ? el('nav', { ariaLabel: 'Pages' }, menuOf(menu)) : '',
          el('p', {}, el('a', { href: `?contact&api=${encodeURIComponent(api)}`, textContent: 'Contact' })),
          el('ul', {}, ...docs.map((post) =>
            el('li', {}, coverOf(post), el('a', { href: `?post=${post.id}`, textContent: post.title })),
          )),
        )
      }

      function showPost(post) {
        app.replaceChildren(
          post.status === 'draft' ? el('p', {}, el('strong', { textContent: 'Draft preview' })) : '',
          coverOf(post),
          el('h1', { textContent: post.title }),
          el('p', { textContent: post.excerpt ?? '' }),
        )
      }

      async function single(id) {
        // With the admin's preview token the draft is readable without a login.
        const token = params.get('easy-cms-preview')
        const query = token ? `&preview=${encodeURIComponent(token)}` : ''
        try {
          showPost(await get(`/posts/${id}?depth=1${query}`))
        } catch {
          app.replaceChildren(el('p', { textContent: 'Waiting for the post…' }))
        }
        // Live preview: the admin posts the edited post on every change (see
        // @easy-cms/core/live-preview for the same thing as a module).
        if (window.parent !== window) {
          window.addEventListener('message', (event) => {
            if (event.origin === origin && event.data?.type === 'easy-cms:preview') showPost(event.data.doc)
          })
          window.parent.postMessage({ type: 'easy-cms:preview-ready' }, '*')
        }
      }

      const post = params.get('post')
      await (params.has('contact')
        ? contact()
        : params.has('page')
          ? page(params.get('page'))
          : post
            ? single(post)
            : list())
    </script>
  </body>
</html>

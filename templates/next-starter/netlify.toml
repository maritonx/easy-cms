# Netlify: Next.js, Postgres from Netlify Database (created at the first deploy because
# @netlify/database is installed; it sets NETLIFY_DB_URL), and uploads in Netlify Blobs.
[build]
  command = "npm run build"
  publish = ".next"

[template.environment]
  EASY_CMS_SETUP_CODE = "A code you choose: you type it to create the first admin at /admin"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy CMS Studio</title>
    <meta name="description" content="Write an Easy CMS config and see its admin, in your browser." />
    <link rel="stylesheet" href="./src/editor/styles.css" />
  </head>
  <body>
    <header class="bar">
      <strong class="brand">Easy CMS <span>Studio</span></strong>
      <span id="status" class="status" data-state="busy" role="status">Starting…</span>
      <span class="spacer"></span>
      <button id="reset" type="button">Reset to the Blog template</button>
      <a href="https://easycms.dev/docs/getting-started" target="_blank" rel="noopener">Docs</a>
    </header>
    <main class="panes">
      <section class="code" aria-label="easy-cms.config.ts">
        <div class="file">easy-cms.config.ts</div>
        <div id="editor" class="editor"></div>
        <div id="error" class="error" role="alert" hidden></div>
        <details class="console">
          <summary>Console <span id="console-count">0</span></summary>
          <button id="console-clear" type="button">Clear</button>
          <ol id="console-lines"></ol>
        </details>
      </section>
      <section class="preview" aria-label="Admin preview">
        <p class="phone-note">Open Studio on a computer to edit the config.</p>
        <iframe
          id="sandbox"
          title="Admin preview"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
        ></iframe>
      </section>
    </main>
    <script type="module" src="./src/editor/main.ts"></script>
  </body>
</html>

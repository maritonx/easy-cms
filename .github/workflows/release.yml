name: Release

on:
  push:
    branches: [main]
  # Publishes the current versions by hand, e.g. after a failed release (Re-run uses the workflow
  # as it was at that commit).
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Publishing uses npm trusted publishing (OIDC): each package on npmjs.com trusts
# maritonx/easy-cms + release.yml, so no npm token is stored in the repository.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit before, to see whether this push changed package versions.
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Publish only when this push changes a package version (merging "Version Packages").
      # Other pushes right after a release would find npm not yet showing the new versions and
      # try to publish them again (E409). A failed release is retried with "Re-run failed jobs".
      - id: versions
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] ||
            git diff HEAD^ HEAD -- 'packages/*/package.json' | grep -q '^+  "version":'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Opens a "Version Packages" PR; merging it publishes to npm.
      # v2 reads the .changeset/pre layout of Changesets 3 (prereleases); v1 failed on it.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: ${{ steps.versions.outputs.changed == 'true' && 'pnpm release' || '' }}
          # As with v1: no tags or GitHub Releases per package; releases are written by hand.
          create-github-releases: false
          push-git-tags: false
        env:
          NPM_CONFIG_PROVENANCE: true

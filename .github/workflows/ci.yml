name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the run still going; on main every commit runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The "Version Packages" pull request and its merge only change versions and changelogs: the
  # same code already passed on the commit before. They get lint only, not the full suite.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.check.outputs.full }}
    steps:
      - id: check
        env:
          HEAD_REF: ${{ github.head_ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$HEAD_REF" == "changeset-release/main" || "$MESSAGE" == *"/changeset-release/main"* || "$MESSAGE" == "Version Packages"* ]]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Version Packages: lint only."
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .

  test:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Other jobs (and releases) stay on ubuntu-24.04; `ubuntu-latest` here shows first what a
        # new Ubuntu image breaks (it moves to Ubuntu 26 from 2026-10-19).
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # --continue: report failures in every package, not just the first. The output is kept so
      # the next step can annotate failures: annotations are public, job logs need a login.
      # The integration suite (SQLite and PGlite, ~70 files) runs on its own afterwards: run
      # alongside every other package on a 3-core macOS runner, PGlite starved for minutes.
      # A package whose test worker crashed in libsql's Windows teardown runs once more (#132).
      - run: node .github/scripts/test-retry-crashes.mjs test-output.log --continue '--filter=!easy-cms-integration-tests'
        shell: bash
      - if: success() || failure()
        run: node .github/scripts/test-retry-crashes.mjs test-output.log --filter=easy-cms-integration-tests
        shell: bash
      - if: failure()
        run: node .github/scripts/annotate-failures.mjs test-output.log "Tests failed (${{ matrix.os }}, Node ${{ matrix.node }})"

  # Line coverage of the server packages, reported to Codecov: not a check that fails.
  coverage:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    env:
      # Missing on forks' pull requests: the report is made, not uploaded.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage
      - if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          disable_search: true

  postgres:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    # The shared integration suites against a real Postgres server (SQLite and PGlite run in "test").
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: easycms
          POSTGRES_PASSWORD: easycms
          POSTGRES_DB: easycms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U easycms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgres://easycms:easycms@localhost:5432/easycms
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter easy-cms-integration-tests exec vitest run --project postgres

  pgbouncer:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    # The same suites through PgBouncer in transaction mode, as serverless hosts' poolers run:
    # any server connection per transaction, no prepared statements. They connect as a role
    # whose search_path is its own schema (database isolation L1), set up as the docs show.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: easycms
          POSTGRES_PASSWORD: easycms
          POSTGRES_DB: easycms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U easycms" --health-interval 5s --health-timeout 5s --health-retries 10
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.0-p0
        env:
          DATABASE_URL: postgres://cms:cms@postgres:5432/easycms
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          MAX_CLIENT_CONN: 200
          DEFAULT_POOL_SIZE: 20
        ports: ['6432:5432']
    env:
      POSTGRES_URL: postgres://cms:cms@localhost:6432/easycms
      POSTGRES_PREPARE: 'false'
      POSTGRES_SCHEMA: easy_cms
    steps:
      - name: Create the role and its schema
        run: >-
          psql postgres://easycms:easycms@localhost:5432/easycms -v ON_ERROR_STOP=1
          -c "CREATE ROLE cms LOGIN PASSWORD 'cms'"
          -c "CREATE SCHEMA easy_cms AUTHORIZATION cms"
          -c "CREATE EXTENSION IF NOT EXISTS pg_trgm SCHEMA easy_cms"
          -c "ALTER ROLE cms SET search_path = easy_cms"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter easy-cms-integration-tests exec vitest run --project postgres

  upgrade:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    # Databases made by older releases (and the latest), migrated and read by this commit.
    name: upgrade (${{ matrix.db }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: easycms
          POSTGRES_PASSWORD: easycms
          POSTGRES_DB: easycms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U easycms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgres://easycms:easycms@localhost:5432/easycms
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node upgrade/run.ts ${{ matrix.db }}

  s3:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    services:
      # S3-compatible server that verifies SigV4 signatures (MinIO no longer publishes images).
      s3:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: ecmsaccess
          RUSTFS_SECRET_KEY: ecmssecret123
        ports: ['9000:9000']
    env:
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: ecmsaccess
      S3_TEST_SECRET_KEY: ecmssecret123
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Wait for the S3 server
        run: for i in $(seq 1 30); do curl -s -o /dev/null localhost:9000 && exit 0; sleep 1; done; exit 1
      - run: pnpm --filter @easy-cms/storage-s3 test

  multi-instance:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    # Two `easy-cms serve` instances on one Postgres and one S3 bucket, behind a round-robin
    # proxy (ADR-0051): REST, sessions and CSRF, login rate limits, uploads and jobs.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: easycms
          POSTGRES_PASSWORD: easycms
          POSTGRES_DB: easycms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U easycms" --health-interval 5s --health-timeout 5s --health-retries 10
      s3:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: ecmsaccess
          RUSTFS_SECRET_KEY: ecmssecret123
        ports: ['9000:9000']
    env:
      POSTGRES_URL: postgres://easycms:easycms@localhost:5432/easycms
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: ecmsaccess
      S3_TEST_SECRET_KEY: ecmssecret123
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Wait for the S3 server
        run: for i in $(seq 1 30); do curl -s -o /dev/null localhost:9000 && exit 0; sleep 1; done; exit 1
      - run: pnpm --filter easy-cms-integration-tests test:multi-instance

  docker:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    # The official image's Dockerfile, built from the newest release on npm and started the way
    # the Docker guide shows. Releases build and publish it (docker.yml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION="$(npm view easy-cms version)" -t easy-cms:test docker
      - run: docker/test.sh easy-cms:test

  e2e:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter easy-cms-e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results

  # A user's path with each package manager: `<pm> create easy-cms`, install, migrate, serve.
  # The packages come from this commit, published to a local registry (Verdaccio).
  template:
    # templates/next-starter (the one-click deploy) with this commit's packages: build, start, pages.
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - run: node scripts/check-template.mjs

  smoke:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: smoke (${{ matrix.pm }}${{ matrix.yarn && format(' {0}', matrix.yarn) || '' }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, pm: npm }
          - { os: ubuntu-24.04, pm: pnpm }
          - { os: ubuntu-24.04, pm: yarn, yarn: stable }
          - { os: ubuntu-24.04, pm: yarn, yarn: '1.22.22' }
          - { os: ubuntu-24.04, pm: bun }
          - { os: windows-latest, pm: npm }
          - { os: windows-latest, pm: pnpm }
    runs-on: ${{ matrix.os }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
      # Corepack's yarn in its own directory, ahead of the runner's preinstalled Yarn 1.
      - if: matrix.pm == 'yarn'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/corepack"
          corepack enable --install-directory "$RUNNER_TEMP/corepack" yarn
          echo "$RUNNER_TEMP/corepack" >> "$GITHUB_PATH"
          corepack prepare yarn@${{ matrix.yarn }} --activate
          # Outside the repo: its package.json says pnpm, and Corepack's yarn refuses to run there.
          cd "$RUNNER_TEMP" && PATH="$RUNNER_TEMP/corepack:$PATH" yarn --version
      - name: Start a local registry
        shell: bash
        run: |
          mkdir -p smoke/.registry
          npx -y verdaccio@6 --config smoke/verdaccio.yaml --listen 4873 > smoke/.registry/verdaccio.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:4873/-/ping > /dev/null && exit 0; sleep 2; done
          cat smoke/.registry/verdaccio.log; exit 1
      - run: node smoke/publish.ts
      - run: node smoke/scaffold.ts ${{ matrix.pm }}

  # The one check the main ruleset requires (with lint). A matrix job that is skipped reports only
  # its bare name, so "test (ubuntu-latest, 24)" never shows up on "Version Packages": this job
  # always runs and fails only when a job it needs failed or was cancelled. Skipped ones pass.
  ci-ok:
    needs: [scope, lint, test, coverage, postgres, pgbouncer, upgrade, s3, multi-instance, docker,
      e2e, template, smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

name: Perf

# 1M posts under 200 editors (90% reads, 10% saves), and one kind of request at a time, every
# night against `easy-cms serve` on Postgres 17. Runners differ by up to about 40% from run to run,
# so the code is judged against a base on the same runner (#256): base, head, head, base, and a
# kind of request more than 25% slower than base (p95) in both halves fails the run. The base is
# the commit of the last successful night, or the `base` input. Earlier nights are shown, not
# judged; the 200 ms target is reported, not enforced. Results are kept as artifacts.
on:
  schedule:
    - cron: '0 20 * * *' # 03:00 in Bangkok
  workflow_dispatch:
    inputs:
      docs:
        description: Posts
        default: '1000000'
      users:
        description: Editors
        default: '200'
      seconds:
        description: Seconds measured per round of editors
        default: '120'
      base:
        description: Base to compare with (ref or sha); default the last successful night
        default: ''
      slowdown_ms:
        description: Delay finding posts by slug in head by this many ms (checks the comparison)
        default: '0'

permissions:
  contents: read
  actions: read

concurrency: perf

jobs:
  load:
    if: github.repository == 'maritonx/easy-cms'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PERF_DOCS: ${{ inputs.docs || '1000000' }}
      PERF_USERS: ${{ inputs.users || '200' }}
      PERF_SECONDS: ${{ inputs.seconds || '120' }}
      PERF_WARMUP: '20'
      PERF_CWD: ${{ github.workspace }}/perf-data/project
      POSTGRES_URL: postgres://easycms:easycms@127.0.0.1:5432/easycms
      # A throwaway database on the runner: not secrets.
      EASY_CMS_SECRET: perf-only-secret-not-used-anywhere-else-0123456789
      PERF_PASSWORD: perf-only-editor-password
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_INPUT: ${{ inputs.base }}
        run: |
          base="$BASE_INPUT"
          if [ -z "$base" ]; then
            base=$(gh run list --workflow perf.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')
          fi
          [ -n "$base" ] || base=$(git rev-parse HEAD~1)
          sha=$(git rev-parse "$base^{commit}")
          echo "BASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "Base $sha, head $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          git worktree add ../base "$sha"
          # The harness is the head's, so both sides run the same requests.
          rm -rf ../base/packages/integration/perf
          cp -r packages/integration/perf ../base/packages/integration/perf
          cp packages/integration/load.ts ../base/packages/integration/load.ts
          cd ../base
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter='easy-cms...' --filter='@easy-cms/db-postgres...'
      # The seeded database (and its migration files), reused until the schema or seed changes.
      - id: data
        uses: actions/cache/restore@v6
        with:
          path: perf-data
          key: perf-pg17-${{ env.PERF_DOCS }}-${{ hashFiles('packages/integration/perf/schema.ts', 'packages/integration/perf/seed.ts') }}
      - name: Start Postgres
        run: |
          mkdir -p perf-data/pg perf-data/project
          # Parallel queries share memory through /dev/shm, 64 MB by default in Docker: at 1M rows
          # they ran out ("could not resize shared memory segment") and failed with 500s.
          docker run -d --name pg --shm-size=1g --user "$(id -u):$(id -g)" -v /etc/passwd:/etc/passwd:ro \
            -v "$PWD/perf-data/pg:/var/lib/postgresql/data" -p 5432:5432 \
            -e POSTGRES_USER=easycms -e POSTGRES_PASSWORD=easycms -e POSTGRES_DB=easycms \
            postgres:17 -c shared_buffers=1GB -c effective_cache_size=4GB -c max_connections=200
          for i in $(seq 1 60); do docker exec pg pg_isready -U easycms -h 127.0.0.1 && exit 0; sleep 2; done; exit 1
      - name: Seed
        run: pnpm --filter easy-cms-integration-tests perf:seed
      # Stopped, so the files are consistent while they are saved.
      - name: Stop Postgres
        if: steps.data.outputs.cache-hit != 'true'
        run: docker stop pg && du -sh perf-data
      - if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: perf-data
          key: ${{ steps.data.outputs.cache-primary-key }}
      - name: Rounds (base, head, head, base)
        run: |
          mkdir -p perf-results
          docker start pg
          for i in $(seq 1 60); do docker exec pg pg_isready -U easycms -h 127.0.0.1 && break; sleep 2; done
          dir_of() { [ "$1" = base ] && echo "$GITHUB_WORKSPACE/../base" || echo "$GITHUB_WORKSPACE"; }
          slow_of() { [ "$1" = head ] && echo "${{ inputs.slowdown_ms || '0' }}" || echo 0; }
          serve() {
            pkill -f 'easy-cms.js serve' || true; sleep 2
            dir=$(dir_of "$1")
            NODE_ENV=production PERF_POOL=20 PERF_SLOWDOWN_MS=$(slow_of "$1") nohup node "$dir/packages/cli/bin/easy-cms.js" serve \
              --port 4000 --config "$dir/packages/integration/perf/easy-cms.config.ts" --cwd "$PERF_CWD" > "serve-$1.log" 2>&1 &
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:4000/readyz && return 0; sleep 2; done
            cat "serve-$1.log"; return 1
          }
          n=0
          for side in base head head base; do
            n=$((n + 1))
            serve "$side"
            (cd packages/integration && node perf/editors.ts "$GITHUB_WORKSPACE/perf-results/editors-$n-$side.json")
          done
          pkill -f 'easy-cms.js serve' || true
          n=0
          for side in base head head base; do
            n=$((n + 1))
            (cd "$(dir_of "$side")/packages/integration" && PERF_SLOWDOWN_MS=$(slow_of "$side") node load.ts "$PERF_DOCS" 10 20) \
              | tee "perf-results/scenarios-$n-$side.txt"
          done
          # What earlier nights and the guide's medians read: the first head round.
          cp perf-results/editors-2-head.json perf-results/results.json
          cp perf-results/scenarios-2-head.txt perf-results/scenarios.txt
      - uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ github.run_id }}
          path: perf-results
          retention-days: 90
      - name: Earlier nights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p earlier
          for id in $(gh run list --workflow perf.yml --branch main --status success --limit 7 --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" --dir "earlier/$id" --pattern 'perf-results-*' || true
          done
      - name: Earlier nights, shown
        run: pnpm --filter easy-cms-integration-tests perf:compare "$PWD/perf-results/results.json" "$PWD/earlier"
      - name: Head against base
        run: pnpm --filter easy-cms-integration-tests perf:compare-ab "$PWD/perf-results"
      - name: Postgres errors
        if: always()
        run: docker logs pg 2>&1 | grep -E 'ERROR|FATAL|PANIC' | sed -E 's/^[0-9-]+ [0-9:.]+ UTC \[[0-9]+\] //' | sort | uniq -c | sort -rn | head -20 || true
      - if: failure()
        run: tail -50 serve-*.log || true

# Version updates once a week: minor and patch together in one pull request, each major on its
# own. Security updates come separately, as soon as an advisory is out (Settings → Code security).
# Dependabot's pull requests carry no changeset, so they release nothing by themselves: add a
# patch changeset when a fix should reach the published packages.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    # Raise a range only when the new version is outside it, so the published packages' ranges
    # (peer ranges included) don't climb for nothing.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    # Updates done by hand, each for its reason.
    ignore:
      # Version updates of stripe fail on the stripe-17 alias (unknown_error), whatever the update
      # type. Security updates still come; minor versions are taken by hand.
      - dependency-name: stripe
      # graphql 16 is installed as graphql-16 to test the oldest supported major; a major update
      # would replace it.
      - dependency-name: graphql
        update-types: [version-update:semver-major]
      # Nuxt's server (Nitro) runs on h3 1; the Nuxt module's handler must use the same major.
      - dependency-name: h3
        update-types: [version-update:semver-major]
      # TypeScript 7 changed the compiler's JavaScript API, which tsup's declaration build uses.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types of the oldest Node the packages support (engines: 22.12), so code can't use newer
      # APIs by accident.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    groups:
      actions:
        patterns: ["*"]
